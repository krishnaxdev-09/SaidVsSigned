note: Hand-labelled clause start boundaries (page, text prefix) for T2.3 boundary F1 (doc 05 §9). Labelled from the PDF text,
  independent of the segmenter. The header block (document title + agreement number) is one clause; each KFS table row (excluding
  the Item/Details header) is one clause; footnotes and small print are separate clauses (a start may list alternatives `a|b` because OCR can drop the superscript marker); numbered clauses and the signature
  line start new clauses. Lender-name title and 'Terms and Conditions' are section headings only (no body of their own).
