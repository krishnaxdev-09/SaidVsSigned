id: RBI-PENAL-2023-NOT-INTEREST
version: 1
retrieved_on: '2026-11-14'
quote:
- para: 3(i)
  text: Penalty, if charged, for non-compliance of material terms and conditions of loan contract by the borrower shall be
    treated
- para: 3(i)
  text: shall not be levied in the form of ‘penal interest’ that is added to the rate of interest
- para: 3(viii)
  text: These instructions shall come into effect from January 1, 2024.
explain_en: Your documents mention 'penal interest'. This may not be consistent with RBI's circular on penal charges (RBI/2023-24/53),
  which asks for penal charges instead of added interest. Ask the lender to confirm how late payments are charged.
explain_hi: आपके दस्तावेज़ों में 'पेनल इंटरेस्ट' लिखा है। यह RBI के पेनल चार्ज सर्कुलर (RBI/2023-24/53) के अनुरूप न हो सकता
  है। लेंडर से पूछें कि देर से भुगतान पर क्या चार्ज लगेगा।
