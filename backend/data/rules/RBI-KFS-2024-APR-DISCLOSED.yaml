quote:
- para: '6'
  text: The KFS shall also include a computation sheet of annual percentage rate (APR)
- para: '11'
  text: all new retail and MSME term loans sanctioned on or after October 1, 2024, including fresh loans to existing customers
explain_en: Your documents don't seem to show the Annual Percentage Rate (APR). This may not be consistent with RBI's KFS
  circular (RBI/2024-25/18). Ask the lender to confirm the APR in writing.
explain_hi: आपके दस्तावेज़ों में सालाना प्रतिशत दर (APR) नहीं दिखती। यह RBI के KFS सर्कुलर (RBI/2024-25/18) के अनुरूप न हो
  सकता है। लेंडर से APR लिखित में पूछें।
