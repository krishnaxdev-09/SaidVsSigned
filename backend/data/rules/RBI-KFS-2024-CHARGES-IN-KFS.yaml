id: RBI-KFS-2024-CHARGES-IN-KFS
version: 1
retrieved_on: '2026-11-14'
quote:
- para: '8'
  text: Any fees, charges, etc. which are not mentioned in the KFS, cannot be charged by the REs to the borrower at any stage
- para: '8'
  text: without explicit consent of the borrower.
explain_en: A charge appears in your documents but not in the Key Fact Statement. This may not be consistent with RBI's KFS
  circular (RBI/2024-25/18). Ask the lender to confirm whether it applies.
explain_hi: एक चार्ज आपके दस्तावेज़ों में है, लेकिन KFS में नहीं। यह RBI के KFS सर्कुलर (RBI/2024-25/18) के अनुरूप न हो सकता
  है। लेंडर से पूछें कि यह लागू है या नहीं।
reviewed_by: null
enabled: false
title: Charges not mentioned in the KFS are not levied
instrument: RBI/2024-25/18 DOR.STR.REC.13/13.03.00/2024-25 — Key Facts Statement (KFS) for Loans & Advances (15 Apr 2024)
source_url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12663&Mode=0
source_url_verified: true
effective_from: '2024-10-01'
applies_when:
  loan_kind: retail_or_msme_term
  sanction_date_gte: '2024-10-01'
checks:
- target: doc_term
  fields:
  - other_charge
  - insurance_bundled
  - processing_fee
  expect:
    in_kfs_table: true
  on_violation: CONFLICT
applicability_detail: Retail and MSME term loans sanctioned on or after 1 Oct 2024. Reviewer to confirm how 'explicit consent'
  interacts with charges stated elsewhere in the agreement.
