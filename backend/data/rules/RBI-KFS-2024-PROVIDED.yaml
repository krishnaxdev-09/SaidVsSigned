id: RBI-KFS-2024-PROVIDED
version: 1
retrieved_on: '2026-11-14'
quote:
- para: '2'
  text: shall be applicable in cases of all retail and MSME term loan products
- para: '4'
  text: REs shall provide a KFS to all prospective borrowers to help them take an informed view before executing the loan
    contract
- para: '11'
  text: all new retail and MSME term loans sanctioned on or after October 1, 2024, including fresh loans to existing customers
explain_en: Your documents don't seem to include a Key Fact Statement. RBI's KFS circular (RBI/2024-25/18) asks lenders to
  give one before you sign. Ask the lender for the KFS.
explain_hi: आपके दस्तावेज़ों में की फ़ैक्ट स्टेटमेंट (KFS) नहीं दिखती। RBI के KFS सर्कुलर (RBI/2024-25/18) के अनुसार साइन
  करने से पहले KFS दी जानी चाहिए। लेंडर से KFS माँगें।
