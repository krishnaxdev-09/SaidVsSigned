id: RBI-PREPAY-2025-FLOATING-PERSONAL
version: 1
retrieved_on: '2026-11-14'
quote:
- para: '4'
  text: These Directions shall apply to all commercial banks (excluding payments banks), co-operative banks, NBFCs
- para: '5'
  text: An RE shall adhere to the following Directions regarding levy of pre-payment charges on all floating rate loans
- para: 5(i)
  text: For all loans granted for purposes other than business to individuals, with or without co-obligant(s),
- para: 5(i)
  text: an RE shall not levy pre-payment charges;
- para: 3(ii)
  text: These Directions shall be applicable to all loans and advances sanctioned or renewed on or after January 1, 2026.
explain_en: Your loan seems to be a floating-rate loan for personal use, but a prepayment charge is mentioned. This may not
  be consistent with RBI's Pre-payment Charges Directions, 2025. Ask the lender to confirm.
explain_hi: आपका लोन फ़्लोटिंग रेट वाला निजी लोन लगता है, फिर भी प्रीपेमेंट चार्ज बताया गया है। यह RBI के प्री-पेमेंट चार्ज
  निर्देश, 2025 के अनुरूप न हो सकता है। लेंडर से पुष्टि करें।
