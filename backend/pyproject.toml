[project]
name = "saidsigned-backend"
version = "0.0.1"
description = "SaidSigned backend — Phase 0 foundation (docs/01, docs/11)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "structlog==24.4.0",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "aioboto3==13.2.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "rapidfuzz==3.14.6",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "websockets==14.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "types-PyYAML==6.0.12.20241221",
  "hypothesis==6.170.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres/MinIO from infra/docker-compose.yml"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S105", "S106", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
