# Local/dev stack (doc 01 §4 step 1). Secrets come from ../.env (generate with `make env`); nothing secret is committed.
name: saidsigned

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saidsigned
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: saidsigned
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saidsigned -d saidsigned"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Q-16: built from pinned upstream source (infra/minio/Dockerfile); official images can't be pulled.
    image: saidsigned/minio:2025-04-22
    build: { context: ./minio }
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?run make env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?run make env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?run make env}   # enables SSE-S3 (doc 12 §B.2)
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: saidsigned/minio:2025-04-22
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "export HOME=/tmp &&
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      for b in audio documents exports; do
        mc mb --ignore-existing local/$$b &&
        mc anonymous set none local/$$b &&
        mc encrypt set sse-s3 local/$$b;
      done"

  api:
    build: { context: ../backend }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://saidsigned:${POSTGRES_PASSWORD}@db:5432/saidsigned
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000   # presigned URLs must be reachable from the browser
    command: >
      sh -c "alembic upgrade head && python -m app.cli seed-consent-texts &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ../backend }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://saidsigned:${POSTGRES_PASSWORD}@db:5432/saidsigned
      S3_ENDPOINT: http://minio:9000
    command: python -m app.worker.runner
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
